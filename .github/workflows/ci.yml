name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./... && GOOS=js GOARCH=wasm go vet ./cmd/wasm
      - name: test
        run: go test -race ./...
      - name: wasm
        run: GOOS=js GOARCH=wasm go build -o /tmp/hindsight.wasm ./cmd/wasm
      - name: install script
        run: sh -n scripts/install.sh
